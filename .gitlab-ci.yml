stages:
  - test
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  VALIDATION_DATA_ROOT: "$CI_PROJECT_DIR/.ci-data"
  VALIDATION_DB: "$CI_PROJECT_DIR/.ci-data/catalog/validation.sqlite"
  VALIDATION_UPLOADS: "$CI_PROJECT_DIR/.ci-data/uploads"
  BEACON_DB: "$CI_PROJECT_DIR/.ci-data/beacon.sqlite"
  BEACON_NCCL_DB: "$CI_PROJECT_DIR/.ci-data/beacon-nccl.sqlite"
  CONFLUENCE_EVIDENCE_DB: "$CI_PROJECT_DIR/.ci-data/confluence.sqlite"

test-python:
  image: python:3.14-slim
  stage: test
  script:
    - python -m pip install -r requirements.lock
    - python tools/check_publication.py
    - python -m compileall -q backend tools
    - python -m pytest -q --junitxml=test-results.xml
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    expire_in: 7 days

test-javascript:
  image: node:22-alpine
  stage: test
  script:
    - node --check frontend/app.js
    - node --check frontend/workflows.js

# Opt-in image build for an approved tag and a Docker-capable GitLab runner.
# This job requires a privileged Docker-in-Docker runner; it does not deploy.
# Set BUILD_CONTAINER=1 for a release pipeline with registry credentials supplied
# by GitLab's CI_JOB_TOKEN, never a checked-in access token.
build-container:
  image: docker:27-cli
  stage: package
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: '$CI_COMMIT_TAG && $BUILD_CONTAINER == "1"'
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" --username gitlab-ci-token --password-stdin
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  after_script:
    - docker logout "$CI_REGISTRY"
